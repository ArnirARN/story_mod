name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: storymod-jar
          path: build/libs/*.jar
      - name: Story game tests
        run: |
          ./gradlew runGameTestServer -PnoCurios --no-daemon > gametest.out 2>&1 || true
          grep -E "required tests|passed|failed|GameTestAssert|Exception" gametest.out | grep -v DEBUG | tail -60 || true
          grep -q "required tests passed" gametest.out
      - name: Smoke test (start a server, load all story data)
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          timeout 300 ./gradlew runServer --no-daemon > server.out 2>&1 &
          for i in $(seq 1 280); do
            if grep -q 'Done (' run/logs/latest.log 2>/dev/null; then break; fi
            sleep 1
          done
          pkill -f 'net.neoforged' || true
          LOG=run/logs/latest.log
          test -f "$LOG"
          grep -q 'Done (' "$LOG"
          grep -qE "Loaded [1-9][0-9]* story dialogues" "$LOG"
          grep -qE "Loaded [1-9][0-9]* story triggers" "$LOG"
          grep -qE "Loaded [1-9][0-9]* story journal entries" "$LOG"
          grep -qiE "curios" "$LOG"
          if grep -iE "storymod" "$LOG" | grep -iE "error|exception|couldn't|failed"; then
            echo "Story data errors found"; exit 1
          fi
      - name: Build the modpack (mods resolved on Modrinth)
        run: |
          cp build/libs/storymod-*.jar storymod.jar
          unzip -l storymod.jar | grep -q "META-INF/jarjar/.*curios" || { echo "Curios is not bundled"; exit 1; }
          NEO=$(curl -sf https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml \
            | grep -oE '<version>21\.1\.[0-9]+</version>' | sed -E 's/<[^>]+>//g' | sort -t. -k3 -n | tail -1)
          echo "Newest NeoForge 21.1: $NEO"; test -n "$NEO"
          echo "NEO=$NEO" >> "$GITHUB_ENV"
          VER=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          PACK_VERSION="$VER-${GITHUB_SHA::7}" python3 pack/build_pack.py storymod.jar "$NEO" out
          cat out/mods.md
          (cd out/server-mods && zip -q ../../server-mods.zip *.jar)
          # Self-updating client (Prism instance) and server starter, both pointing at the packwiz pack.
          PACK_URL="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/pack/pack.toml"
          curl -fsSL -o bootstrap.jar https://github.com/packwiz/packwiz-installer-bootstrap/releases/download/v0.0.3/packwiz-installer-bootstrap.jar
          rm -rf kit && mkdir -p kit && cp -r pack/prism kit/prism && cp -r pack/server kit/server
          mkdir -p kit/prism/.minecraft
          cp bootstrap.jar kit/prism/.minecraft/packwiz-installer-bootstrap.jar
          cp bootstrap.jar kit/server/packwiz-installer-bootstrap.jar
          sed -i "s|__PACK_URL__|$PACK_URL|g; s|__NEO__|$NEO|g" kit/prism/* kit/server/start.*
          (cd kit/prism && zip -qr ../../StoryMod-Prism.zip .)
          # Try the pack with the real installer (server side) from the local files.
          mkdir -p pwtest && (cd pwtest && timeout 300 java -jar ../bootstrap.jar -g -s server "file://$GITHUB_WORKSPACE/out/packwiz/pack.toml" 2>&1 | tail -15) || true
          echo "Installer test placed $(ls pwtest/mods 2>/dev/null | wc -l) server mods; expected $(ls out/server-mods | wc -l) + storymod"
          (cd kit/server && zip -qr ../../storymod-server.zip .)
          cp out/storymod.mrpack storymod.mrpack
      - name: Smoke test with every mod from the pack
        run: |
          rm -rf run/world run/logs run/mods
          mkdir -p run/mods
          cp out/server-mods/*.jar run/mods/
          timeout 900 ./gradlew runServer -PnoCurios -Pneo_version="$NEO" --no-daemon > server-mods.out 2>&1 &
          for i in $(seq 1 880); do
            if grep -qE 'Done \(|Crash report|Failed to start|ModLoadingException' run/logs/latest.log server-mods.out 2>/dev/null; then break; fi
            sleep 1
          done
          sleep 5
          pkill -f 'net.neoforged' || true
          LOG=run/logs/latest.log
          if ! grep -q 'Done (' "$LOG"; then
            grep -iE "error|exception|missing|requires" "$LOG" server-mods.out | grep -v DEBUG | head -80
            exit 1
          fi
          grep -qE "Loaded [1-9][0-9]* story dialogues" "$LOG"
          if grep -iE "storymod" "$LOG" | grep -iE "error|exception|couldn't|failed"; then
            echo "Story data errors with mods"; exit 1
          fi
      - name: Publish the "latest" release
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Свежая сборка для Minecraft 1.21.1, NeoForge $NEO."
            echo
            echo "- **StoryMod-Prism.zip**: импортируйте в Prism Launcher. При каждом запуске игры моды сами скачиваются и обновляются."
            echo "- **storymod-server.zip**: сервер. Запустите start.bat или start.sh: он сам поставит NeoForge и при каждом запуске обновит серверные моды."
            echo "- **storymod.mrpack**: импортируйте в Modrinth App или Prism Launcher. Поставит Minecraft, NeoForge, мод и все моды ниже, но без автообновления."
            echo "- **storymod.jar**: только сам мод (Curios уже внутри)."
            echo "- **server-mods.zip**: все моды для сервера, распакуйте в папку mods рядом с storymod.jar."
            echo
            cat out/mods.md
          } > notes.md
          # Publish the packwiz pack to the "pack" branch; clients and servers update from it on start.
          cd out/packwiz
          git init -q && git checkout -q -b pack && git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -qm "Pack ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/$GITHUB_REPOSITORY.git" pack
          cd ../..
          gh release delete latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create latest StoryMod-Prism.zip storymod-server.zip storymod.mrpack storymod.jar server-mods.zip --repo "$GITHUB_REPOSITORY" --prerelease \
            --target "${{ github.event.pull_request.head.sha || github.sha }}" \
            --title "Последняя сборка" --notes-file notes.md
