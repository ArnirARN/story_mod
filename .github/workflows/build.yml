name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: storymod-jar
          path: build/libs/*.jar
      - name: Smoke test (start a server, load all story data)
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          timeout 300 ./gradlew runServer --no-daemon > server.out 2>&1 &
          for i in $(seq 1 280); do
            if grep -q 'Done (' run/logs/latest.log 2>/dev/null; then break; fi
            sleep 1
          done
          pkill -f 'net.neoforged' || true
          LOG=run/logs/latest.log
          test -f "$LOG"
          grep -q 'Done (' "$LOG"
          grep -q "Loaded 3 story dialogues" "$LOG"
          grep -q "Loaded 4 story triggers" "$LOG"
          grep -q "Loaded 17 story journal entries" "$LOG"
          if grep -iE "storymod" "$LOG" | grep -iE "error|exception|couldn't|failed"; then
            echo "Story data errors found"; exit 1
          fi
