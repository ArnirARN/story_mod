name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: storymod-jar
          path: build/libs/*.jar
      - name: Smoke test (start a server, load all story data)
        run: |
          ./gradlew runGameTestServer --no-daemon || true
          LOG=run/logs/latest.log
          test -f "$LOG"
          grep -q "Loaded 3 story dialogues" "$LOG"
          if grep -iE "storymod" "$LOG" | grep -iE "error|exception|couldn't|failed"; then
            echo "Story data errors found"; exit 1
          fi
