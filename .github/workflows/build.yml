name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: storymod-jar
          path: build/libs/*.jar
      - name: Story game tests
        run: |
          ./gradlew runGameTestServer -PnoCurios --no-daemon > gametest.out 2>&1 || true
          grep -E "required tests|passed|failed|GameTestAssert|Exception" gametest.out | grep -v DEBUG | tail -60 || true
          grep -q "required tests passed" gametest.out
      - name: Smoke test (start a server, load all story data)
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          timeout 300 ./gradlew runServer --no-daemon > server.out 2>&1 &
          for i in $(seq 1 280); do
            if grep -q 'Done (' run/logs/latest.log 2>/dev/null; then break; fi
            sleep 1
          done
          pkill -f 'net.neoforged' || true
          LOG=run/logs/latest.log
          test -f "$LOG"
          grep -q 'Done (' "$LOG"
          grep -qE "Loaded [1-9][0-9]* story dialogues" "$LOG"
          grep -qE "Loaded [1-9][0-9]* story triggers" "$LOG"
          grep -qE "Loaded [1-9][0-9]* story journal entries" "$LOG"
          grep -qiE "curios" "$LOG"
          if grep -iE "storymod" "$LOG" | grep -iE "error|exception|couldn't|failed"; then
            echo "Story data errors found"; exit 1
          fi
      - name: Publish the jar as the "latest" release
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/libs/storymod-*.jar storymod.jar
          unzip -l storymod.jar | grep -q "META-INF/jarjar/.*curios" || { echo "Curios is not bundled"; exit 1; }
          # One-click modpack for Modrinth App / Prism Launcher: installs Minecraft, NeoForge and the mod.
          NEO=$(grep '^neo_version=' gradle.properties | cut -d= -f2)
          MC=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)
          VER=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          rm -rf pack && mkdir -p pack/overrides/mods
          cp storymod.jar pack/overrides/mods/storymod.jar
          printf '{"formatVersion":1,"game":"minecraft","versionId":"%s-%s","name":"Story Mod","summary":"Сюжетный мод с NeoForge","files":[],"dependencies":{"minecraft":"%s","neoforge":"%s"}}' \
            "$VER" "${GITHUB_SHA::7}" "$MC" "$NEO" > pack/modrinth.index.json
          (cd pack && zip -qr ../storymod.mrpack modrinth.index.json overrides)
          gh release delete latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create latest storymod.jar storymod.mrpack --repo "$GITHUB_REPOSITORY" --prerelease \
            --target "${{ github.event.pull_request.head.sha || github.sha }}" \
            --title "Последняя сборка" \
            --notes "Свежая сборка мода для Minecraft 1.21.1 (NeoForge 21.1.x). Curios уже внутри. storymod.mrpack: импортируйте в Modrinth App или Prism Launcher, NeoForge поставится сам. storymod.jar: положите в папку mods на сервере (и у игроков, если ставите вручную)."
